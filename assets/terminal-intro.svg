    <text x="126" y="164" fill="#6e7681">:</text>
    <text x="136" y="164" fill="#98c379">"Aix-en-Provence, France <ë<÷"</text><text x="378" y="164" fill="#6e7681">,</text>

    <text x="36" y="187" fill="#a67fd4">"status"</text>
    <text x="106" y="187" fill="#6e7681">:</text>
    <text x="116" y="187" fill="#98c379">"Bachelor @ Ynov Aix  B2"</text><text x="352" y="187" fill="#6e7681">,</text>

